<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ النص - Pale Blue Dot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
            touch-action: pan-y;
        }
        .swiper {
            width: 100vw;
            height: 100vh;
        }
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }
        .swiper-slide-active {
            opacity: 1;
        }
        .script-text {
            font-size: clamp(1.5rem, 6vw, 3.5rem);
            line-height: 1.6;
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 900px;
        }
        #progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="antialiased">

    <!-- شريط التقدم -->
    <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-800 z-50">
        <div id="progress-bar" class="h-full bg-emerald-500 w-0 shadow-[0_0_10px_#10b981]"></div>
    </div>

    <!-- العداد والأدوات -->
    <div class="absolute top-4 right-4 left-4 flex justify-between items-center z-50 opacity-50 hover:opacity-100 transition-opacity">
        <div class="text-sm font-mono bg-slate-900/80 px-3 py-1 rounded-full border border-slate-700">
            <span id="current-slide">1</span> / <span id="total-slides">0</span>
        </div>
        <div class="text-xs text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-700">
            <i class="fa-solid fa-arrows-left-right"></i> اسحب للتنقل
        </div>
    </div>

    <!-- حاوية السلايدر -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="script-container">
            <!-- سيتم حقن النصوص هنا عبر جافاسكريبت -->
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <script>
        // النص مقسم إلى جمل 
        const scriptLines = [
            "من نقطةِ النظرِ البعيدةِ هذه، قد لا تبدو للأرضِ أيّةُ أهميةٍ خاصة؛",
            "ولكن بالنسبةِ لنا، الأمرُ مختلفٌ تماماً.",
            "أعِد النظرَ لتلك النقطة: إنها هنا! إنها الوطن! إنها نحن!",
            "فعليها: كلُّ من تحب، كلُّ من تعرف، كلُّ شخصٍ سمعتَ عنه،",
            "كلُّ كائنٍ بشريٍّ وُجد طوالَ التاريخ، عاش حياتَهُ هناك.",
            "محصلةُ كلِّ الأفراحِ والأحزان، ألوفُ الأديانِ والنظرياتِ ومذاهبِ الحياة،",
            "كلُّ صيادٍ وقاتل، كلُّ بطلٍ وجبان، كلُّ خالقٍ وهادمٍ لحضارة،",
            "كلُّ ملكٍ وفلاّح، كلُّ شابين متحابين، كلُّ أمٍّ وأب، طفلٍ ذي أمل،",
            "مُخترعٍ ومُكتشف، كلُّ ناشرٍ لخلقٍ حميد، كلُّ سياسيٍّ فاسد،",
            "كلُّ نجمٍ سينمائي، كلُّ قائدٍ عظيم،",
            "كلُّ مُتدينٍ ومُذنبٍ في تاريخِ وجودِ كائنِنا البشريّ؛",
            "كلُّهم عاشوا هناك.. على ذرةٍ من غبار، عالقةٍ في شعاعٍ شمسي.",
            "ما الأرضُ سوى بقعةٍ صغيرةٍ للغاية، في مسرحٍ كونيٍّ عظيم!",
            "تفكّر لوهلةٍ في أنهارِ الدماءِ التي أراقها جنرالاتُ الحربِ وأباطرتُها،",
            "لينتصروا ويصبحوا أسياداً لحظيينَ على جزءٍ عشريٍّ من نقطة.",
            "تفكّر لوهلةٍ بالقسوةِ التي ملأت قلبَ شعبٍ عاش على إحدى زوايا هذه النقطة،",
            "ليغورَ ويتغلبَ على شعبٍ آخرَ عاش على زاويةٍ أخرى منها، بالكادِ نستطيعُ التمييزَ بينهما.",
            "كم كان جهلُهُم، وسوءُ فهمِهم للآخر؟! كم كان غرورهم، ليقتلَ أحدُهم الآخر؟!",
            "كم كانت كراهيتُهم الشديدةُ وبغضُهم لبعضِهم البعض؟!",
            "إنَّ تَصنُّعَنا، وتوهُّمَ أهميتِنا، والاعتقادَ بأنَّ لنا مكانةً مميزةً في هذا الكون؛",
            "كلُّ تلك الخيالاتِ تعترضُها بقوةٍ.. نقطةُ الضوءِ الباهتةِ تلك.",
            "كوكبُنا هو ومضةٌ وحيدةٌ في فراغٍ كونيٍّ مظلم.",
            "خلال وجودِنا في هذا الظلامِ الهائل، لا نمتلكُ أيَّ دليلٍ بأن مساعدةً ستأتي يوماً من الخارج لإنقاذنا من أنفسِنا.",
            "للآن، الأرضُ هي الكوكبُ الوحيدُ الذي يمكنه احتضانُ الحياة،",
            "ولا يوجد أيُّ مكانٍ –على الأقل خلال الفترة القريبة هذه– يمكننا الرحيل إليه.",
            "ربما يمكننا زيارةُ الخارج، أما البقاءُ خارجَ الأرضِ فليس بممكنٍ بعد.",
            "سواءٌ أعجبتك الفكرةُ أم لا؛ هذا الكوكبُ هو مصيرُنا.",
            "يُقال: إنَّ دراسةَ الفضاءِ تُعلِّمُ التواضعَ، وتبني صورةً إنسانيةً في دارسِها.",
            "بالنسبة لي، لا توجد أيّةُ طريقةٍ لإسقاطِ الصورةِ الوهميةِ المرتبطةِ بنا كبشر،",
            "أفضلُ من النظرِ إلى هذه الصورة البعيدةِ لكوكبِنا الأرض.",
            "بالنسبة لي، أن نتعاملَ بشكلٍ أكثرَ مودةً واحتراماً لبعضِنا البعض،",
            "لهو مسألةٌ تتجاوزُ جميعَ المسؤوليات،",
            "وأن نحميَ ونحافظَ على “النقطةِ الزرقاءِ الباهتة”، الوطنِ الوحيدِ الذي عرفناه."
        ];

        const container = document.getElementById('script-container');
        const totalSlidesEl = document.getElementById('total-slides');
        const currentSlideEl = document.getElementById('current-slide');
        const progressBar = document.getElementById('progress-bar');

        // بناء الشرائح
        scriptLines.forEach((line) => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.innerHTML = `<div class="script-text text-emerald-50">${line}</div>`;
            container.appendChild(slide);
        });

        totalSlidesEl.textContent = scriptLines.length;

        // تهيئة Swiper
        const swiper = new Swiper(".mySwiper", {
            direction: "horizontal",
            keyboard: {
                enabled: true,
            },
            mousewheel: true,
            grabCursor: true,
            spaceBetween: 50,
            on: {
                init: function () {
                    updateProgress(this);
                },
                slideChange: function () {
                    updateProgress(this);
                }
            }
        });

        function updateProgress(swiperInstance) {
            const current = swiperInstance.activeIndex + 1;
            const total = scriptLines.length;
            
            currentSlideEl.textContent = current;
            
            // حساب نسبة التقدم
            const progressPercent = (current / total) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }
    </script>
</body>
</html>
